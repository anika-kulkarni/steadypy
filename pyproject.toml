[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "steadypy"
dynamic = ["version"]
description = "Reliable primitives for production asyncio services."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anika Kulkarni" }]
keywords = [
    "asyncio",
    "reliability",
    "supervisor",
    "retry",
    "backoff",
    "circuit-breaker",
    "rate-limit",
    "concurrency",
    "graceful-shutdown",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Linters are pinned so that a new release cannot change the rules under CI.
    "ruff==0.17.1",
    "mypy==2.4.0",
    "coverage[toml]>=7.4",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/anika-kulkarni/steadypy"
Source = "https://github.com/anika-kulkarni/steadypy"
Issues = "https://github.com/anika-kulkarni/steadypy/issues"
Changelog = "https://github.com/anika-kulkarni/steadypy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/steadypy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/steadypy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["steadypy"]

[tool.coverage.paths]
source = ["src/steadypy", "*/site-packages/steadypy"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ASYNC109", # tests pass explicit timeouts on purpose
    "ASYNC110", # tests may poll in loops
    "PT012",    # async with blocks inside pytest.raises are inherently multi-line
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
