name: Publish to PyPI

# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
# Runs only when started by hand, with the version to publish as input.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match steadypy.__version__)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine

      - name: Run the test suite
        run: python -m pytest

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Check the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          ls dist/
          test -f "dist/steadypy-${REQUESTED}.tar.gz"
          test -f "dist/steadypy-${REQUESTED}-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/steadypy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
